plugins { id 'com.android.application' version '8.5.2' }
android {
    namespace 'com.obyavka.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.obyavka.game'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_PATH') ?: 'release.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'obyavka'
            keyPassword System.getenv('KS_PASS')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
