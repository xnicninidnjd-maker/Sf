<script>
const $=s=>document.querySelector(s),R=n=>Math.random()*n|0,fm=n=>n.toLocaleString('ru')+' ₽';

const sum=ds=>ds.reduce((a,d)=>a+D[d][2],0),r50=x=>Math.round(x/50)*50,val=p=>r50(p.mk*(1-sum(p.ds))*(.8+.2*p.bat/100));

const ic=(d,w)=>`<svg viewBox="0 0 100 100" width="${w}" height="${w}">${I[d]}</svg>`,vis=(p,d)=>!p.pt&&p.ds.includes(d)&&p.hid!=d;
const PH=(k,c,bad)=>k==1?`<svg viewBox="0 0 60 110" height="100%"><rect x="2" y="2" width="56" height="106" rx="9" fill="${c}" stroke="#0005" stroke-width="2"/><circle cx="16" cy="16" r="7" fill="#222"/><circle cx="16" cy="16" r="3" fill="#468"/><circle cx="30" cy="62" r="6" fill="#fff5"/>${bad?'<path d="M10 40L30 60L22 80L48 100M30 60L52 50" stroke="#fff" fill="none"/>':''}</svg>`:`<svg viewBox="0 0 60 110" height="100%"><rect x="2" y="2" width="56" height="106" rx="9" fill="#111"/><rect x="6" y="6" width="48" height="98" rx="6" fill="#2a3a5c"/><rect x="22" y="8" width="16" height="4" rx="2" fill="#000"/><text x="30" y="55" font-size="11" fill="#fff" text-anchor="middle">9:41</text>${bad?'<path d="M8 20L30 55L24 80L52 100M30 55L52 38" stroke="#fff" fill="none"/>':''}</svg>`;
function gen(){const mi=R(M.length),m=M[mi],id=++S.id,city=CT[R(5)];
 if(Math.random()<.25){const d=R(D.length),mk=Math.max(50,r50(m[2]*D[d][2]*.5));return{id,pt:1,d,mi,mk,price:Math.max(50,r50(mk*(.6+Math.random()*.7))),city}}
 const n=R(4),ds=[];while(ds.length<n){const d=R(D.length);if(!ds.includes(d))ds.push(d)}
 const mk=r50(m[2]*(.8+Math.random()*.4));
 return{id,mi,ds,hid:n>1&&Math.random()<.6?ds[n-1]:-1,bat:60+R(41),mk,price:r50(mk*(1-sum(ds))*(.85+Math.random()*.2)),city}}
while(S.ads.length<24)S.ads.push(gen());
function tt(s){const e=$('#ts');e.textContent=s;e.style.display='block';clearTimeout(tm);tm=setTimeout(()=>e.style.display='none',2800)}
function o(h){if(!h)cur=0;const s=$('.sh'),t=s?s.scrollTop:0;$('#o').innerHTML=h?`<div class=ov onclick="if(event.target==this&&!RP)o()"><div class=sh>${h}</div></div>`:'';if(h&&t)$('.sh').scrollTop=t}

function draw(k){$('#w').textContent='💳 '+fm(S.m);document.querySelectorAll('nav button').forEach((b,i)=>b.className=i==tab?'a':'');if(!k)window.scrollTo(0,0);const v=$('#v');
 if(tab==0){v.innerHTML=`<div style="padding:0 12px"><input id=qi class=in placeholder="Поиск телефонов" oninput="q=this.value.toLowerCase();gr()"><div style="overflow-x:auto;white-space:nowrap;margin:6px 0">${['','Apple','Samsung','Xiaomi','Huawei','Другие'].map(b=>`<span class="ch ${b==br?'on':''}" onclick="br='${b}';draw()">${b||'Все'}</span>`).join('')}</div></div><div class=g2 id=gr></div>`;$('#qi').value=q;gr()}
 else if(tab==1){v.innerHTML=`<div class=c style="margin:0 12px 10px"><b>📦 Запчасти на складе</b><div>${S.parts.map(x=>`<span class=ch>${x}</span>`).join('')||'<small> пусто</small>'}</div><button class="bt B" onclick="shop()">🛒 Магазин запчастей (оплата картой)</button><button class="bt B" onclick="asm()">🧩 Собрать свой телефон</button></div>`+(S.own.map(p=>`<div class=c style="margin:0 12px 10px"><b>${nm(p)}</b><div><small>${p.cu?'Детали на':'Куплен за'} ${fm(p.paid)} · оценка ${fm(val(p))} · Аккумулятор: ${p.bat}%</small></div>${p.ds.map(d=>`<div class=rd style="display:flex;justify-content:space-between;align-items:center;gap:8px">${ic(d,28)}<span style="flex:1">${D[d][1]}</span><button class="bt B" style="width:auto;margin:0;padding:6px 12px" onclick="rep(${p.id},${d})">🔧 Чинить</button></div>`).join('')}<button class="bt N" onclick="dsm(${p.id})">🔩 Разобрать на запчасти</button><button class="bt N" onclick="ckO(${p.id})">🔍 Проверить телефон</button>${p.of?`<div class=rd style="background:#fff3cd;color:#333">💬 ${p.of.n}: «Отдадите за ${fm(p.of.v)}?»<div style="display:flex;gap:6px"><button class="bt G" style="margin:6px 0 0;padding:8px" onclick="ofr(${p.id},1)">Принять</button><button class="bt B" style="margin:6px 0 0;padding:8px" onclick="ofr(${p.id},2)">Встречное</button><button class="bt N" style="margin:6px 0 0;padding:8px" onclick="ofr(${p.id},0)">Отказ</button></div></div>`:''}<button class="bt P" onclick="askm(${p.id})">${p.ask?'📢 Цена: '+fm(p.ask)+' (изменить)':'📢 Выставить на продажу'}</button><button class="bt G" onclick="sell(${p.id})">Быстро продать по оценке</button></div>`).join('')||'<p style="padding:0 16px;color:var(--m)">Пока нет телефонов. Купи что-нибудь в «Объявлениях».</p>')}
 else v.innerHTML=`<div class=c style="margin:0 12px"><h3 style="margin:0 0 8px">Профиль</h3>Продано телефонов: <b>${S.sold}</b><br>Чистая прибыль: <b>${fm(S.pr)}</b><br>Баланс: <b>${fm(S.m)}</b><button class="bt N" onclick="rs()">Начать заново</button></div>`}
function rs(){S={m:10750,ads:[],own:[],parts:[],sold:0,pr:0,id:0};while(S.ads.length<24)S.ads.push(gen());sv();draw()}
function det(id,k){const p=S.ads.find(a=>a.id==id);if(!p)return;cur=id;const m=M[p.mi],loc=p.city=='Казань',dis=p.pt?[]:p.ds.filter(d=>d!=p.hid||p.chk),off=Math.round((1-p.price/p.mk)*100),L=['экран','тыл','аккумулятор','низ'],h=d=>dis.includes(d),
 T=p.pt?'≡':[h(0)?'🕸️':'9:41',h(1)?'🕸️ тыл':'тыл',p.bat+'%',h(6)?'⚡ ?':'USB-C'][k];
 o(`<div class=art style="height:190px;border-radius:14px;background:${p.pt?'#254a38':m[3]}" onclick="det(${id},${(k+1)%4})"><div style="height:165px;text-align:center;color:#111;font-weight:700">${p.pt?ic(p.d,150):[PH(0,m[3],h(0)),PH(1,m[3],h(1)),ic(2,120)+'<div>'+p.bat+'%</div>',ic(6,120)+(h(6)?'<div>⚡ ?</div>':'')][k]}</div></div>`+(p.pt?'':`<small style="color:var(--m)">Листай (нажми на телефон): ${L.map((x,i)=>i==k?'<b>'+x+'</b>':x).join(' · ')}</small>`)+`<h2 style="margin:6px 0 0">${fm(p.price)}</h2><div>${ttl(p)}</div><div class=rd style="background:#dff7e8;color:#12803a">${off>=0?'Ниже':'Выше'} рынка на ${Math.abs(off)}% · рынок ~${fm(p.mk)}</div><div class=rd style="background:var(--c);color:var(--t)">📍 ${p.city} · ${loc?'ваш город, можно за наличные':'другой город: только онлайн-оплата, доставка +400 ₽'}</div>`+(dis.length?`<div class=rd>Ещё: ${dis.map(d=>D[d][1]).join(', ')}</div>`:'')+`<button class="bt P" onclick="buy(${id},0)">${loc?'Самовывоз с онлайн-оплатой 💳':'Онлайн-оплата и доставка 💳'} · ${fm(p.price+(loc?0:400))}</button>`+(loc?`<button class="bt G" onclick="buy(${id},1)">Купить за наличные 💵 · ${fm(Math.round(p.price*.95))} (−5%)</button>`:'')+(p.pt?'':loc?`<button class="bt B" onclick="chkL(${id})">🔍 Проверить телефон</button>`:'<small style="color:var(--m)">Проверить телефон можно только в своём городе</small>')+`<button class="bt N" onclick="nego(${id})">💬 Написать (торг)</button><button class="bt N" onclick="o()">Закрыть</button>`)}
